name: Apply demo interior integration v2

on:
  push:
    branches: ["demo/review-interior-gallery"]
    paths:
      - ".github/workflows/apply-demo-interior-v2.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Apply transformation
        run: python3 tools/apply_demo_interior.py
      - name: Validate JavaScript and assets
        run: |
          node --check script.js
          test -s assets/demo/latte-editorial.jpg
          test -s assets/demo/storefront-editorial.jpg
      - name: Capture previews
        run: |
          mkdir -p docs/screenshots
          python3 -m http.server 4173 >/tmp/site-server.log 2>&1 &
          sleep 2
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=7000 --window-size=1440,1200 --screenshot=docs/screenshots/review-interior-desktop.png http://127.0.0.1:4173/
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=7000 --window-size=390,844 --screenshot=docs/screenshots/review-interior-mobile.png http://127.0.0.1:4173/
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css docs/screenshots
          if ! git diff --cached --quiet; then
            git commit -m "feat: integrate real cafe imagery into elegant redesign"
            git push origin HEAD:demo/review-interior-gallery
          fi
