name: Bootstrap website source and deploy

on:
  push:
    branches: ["main"]
    paths:
      - ".deploy/**"
      - ".github/workflows/bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bootstrap:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore website source
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G ".deploy/*.part" > /dev/null; then
            cat .deploy/*.part > /tmp/home-brew-cafe.zip.b64
            base64 --decode /tmp/home-brew-cafe.zip.b64 > /tmp/home-brew-cafe.zip
            rm -rf /tmp/home-brew-cafe
            mkdir -p /tmp/home-brew-cafe
            unzip -q /tmp/home-brew-cafe.zip -d /tmp/home-brew-cafe
            rsync -a --exclude='.github/workflows/' /tmp/home-brew-cafe/home-brew-cafe/ ./
            rm -rf .deploy
          fi

      - name: Commit restored source
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet || ! git diff --cached --quiet || [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "feat: launch futuristic Skip to My Brew website"
            git push origin HEAD:main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Stage static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir _site
          cp index.html styles.css script.js 404.html favicon.svg manifest.webmanifest .nojekyll _site/

      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
