name: Restore classic redesign package

on:
  push:
    branches: ["redesign/classic-elegant-threejs"]
    paths:
      - ".deploy/**"
      - ".github/workflows/redesign-bootstrap.yml"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Restore package
        shell: bash
        run: |
          set -euo pipefail
          cat .deploy/*.part > /tmp/redesign.zip.b64
          base64 --decode /tmp/redesign.zip.b64 > /tmp/redesign.zip
          echo "69ac099a72d114fb37946ac87fb3eb59d0d431b510071bc8afa69e785784193f  /tmp/redesign.zip" | sha256sum --check -
          rm -rf /tmp/redesign
          mkdir -p /tmp/redesign
          unzip -q /tmp/redesign.zip -d /tmp/redesign
          rsync -a --delete --exclude=".git/" --exclude=".gitignore" /tmp/redesign/home-brew-cafe/ ./

      - name: Commit restored redesign
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: redesign with classic photography-led Three.js"
          git push origin HEAD:redesign/classic-elegant-threejs
